[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlfolio"
version = "0.1.0"
description = "Event-driven backtester and portfolio optimizer driven by Q-learning and Double Dueling DQN agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11"]

[project.optional-dependencies]
yahoo = ["yfinance>=0.2.40"]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8"]
all = ["yfinance>=0.2.40", "matplotlib>=3.8", "pytest>=8"]

[project.scripts]
rlfolio = "rlfolio.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
